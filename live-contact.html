<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Contact & Social Hub</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome 6 Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    body { background-color: #090a0f; color: #f3f4f6; }
    .glass-card {
      background: rgba(18, 20, 29, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      border-color: rgba(249, 115, 22, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white relative">

  <!-- Background Ambient Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[700px] h-[450px] bg-orange-600/15 rounded-full blur-[140px]"></div>
    <div class="absolute bottom-10 -left-20 w-[500px] h-[400px] bg-blue-600/10 rounded-full blur-[130px]"></div>
    <div class="absolute top-1/2 -right-20 w-[450px] h-[350px] bg-emerald-600/10 rounded-full blur-[130px]"></div>
  </div>

  <!-- ROOT CONTAINER: Initially empty loading state, 100% replaced by API response -->
  <div id="app" class="w-full flex-1 flex flex-col justify-between">
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
      <div class="w-14 h-14 border-4 border-orange-500/20 border-t-orange-500 rounded-full animate-spin mb-4"></div>
      <div class="text-white font-bold text-lg">Fetching All Data From Live API...</div>
      <div class="text-xs font-mono text-zinc-500 mt-1 select-all">GET https://mrsaqib242.vercel.app/api/public/contact</div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- JAVASCRIPT: 100% DYNAMIC - ZERO HARDCODED STRINGS -->
  <!-- ========================================================================= -->
  <script>
    const API_ENDPOINT = "https://mrsaqib242.vercel.app/api/public/contact";

    // Platform metadata for styling & icons only (values come 100% from API)
    const PLATFORMS = {
      whatsapp: { label: "WhatsApp", icon: "fa-brands fa-whatsapp", color: "text-emerald-400", bg: "bg-emerald-500/10" },
      email: { label: "Official Email", icon: "fa-solid fa-envelope", color: "text-orange-400", bg: "bg-orange-500/10", isEmail: true },
      phone: { label: "Direct Phone", icon: "fa-solid fa-phone", color: "text-violet-400", bg: "bg-violet-500/10", isPhone: true },
      instagram: { label: "Instagram", icon: "fa-brands fa-instagram", color: "text-pink-400", bg: "bg-pink-500/10" },
      github: { label: "GitHub", icon: "fa-brands fa-github", color: "text-zinc-200", bg: "bg-zinc-800" },
      portfolio: { label: "Portfolio Website", icon: "fa-solid fa-globe", color: "text-blue-400", bg: "bg-blue-500/10" },
      facebook: { label: "Facebook", icon: "fa-brands fa-facebook", color: "text-blue-500", bg: "bg-blue-600/10" },
      tiktok: { label: "TikTok", icon: "fa-brands fa-tiktok", color: "text-rose-400", bg: "bg-rose-500/10" },
      snapchat: { label: "Snapchat", icon: "fa-brands fa-snapchat", color: "text-yellow-300", bg: "bg-yellow-400/10" },
      resume: { label: "Curriculum Vitae", icon: "fa-solid fa-file-pdf", color: "text-teal-400", bg: "bg-teal-500/10" }
    };

    async function loadLiveData() {
      const app = document.getElementById('app');

      try {
        const response = await fetch(API_ENDPOINT);
        if (!response.ok) throw new Error(`API returned HTTP ${response.status}`);
        
        const json = await response.json();
        if (!json.success || !json.data) throw new Error("API response missing data");

        // DYNAMIC DATA FROM API
        const data = json.data;

        // Build dynamic social cards purely from API keys
        let cardsHtml = '';
        let activeChannelsCount = 0;

        for (const [key, config] of Object.entries(PLATFORMS)) {
          const rawValue = data[key];
          if (!rawValue || typeof rawValue !== 'string' || !rawValue.trim()) continue;

          activeChannelsCount++;

          let targetHref = rawValue;
          if (config.isEmail) targetHref = `mailto:${rawValue}`;
          else if (config.isPhone) targetHref = `tel:${rawValue.replace(/[^0-9+]/g, '')}`;

          cardsHtml += `
            <a href="${targetHref}" target="_blank" class="glass-card rounded-2xl p-4 flex items-center justify-between group">
              <div class="flex items-center gap-3.5 min-w-0">
                <div class="w-12 h-12 rounded-2xl ${config.bg} ${config.color} flex items-center justify-center text-xl shrink-0">
                  <i class="${config.icon}"></i>
                </div>
                <div class="min-w-0">
                  <div class="text-[10px] uppercase font-bold text-zinc-400 tracking-wider">${config.label}</div>
                  <div class="text-xs sm:text-sm font-bold text-white group-hover:text-orange-400 transition-colors truncate font-mono">${rawValue}</div>
                </div>
              </div>
              <div class="w-8 h-8 rounded-full bg-white/5 group-hover:bg-orange-500/20 text-zinc-400 group-hover:text-orange-400 flex items-center justify-center transition-colors shrink-0">
                <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
              </div>
            </a>
          `;
        }

        // Render entire page using ONLY data returned from the API
        app.innerHTML = `
          <!-- Header (Dynamic) -->
          <header class="w-full border-b border-white/5 bg-zinc-950/70 backdrop-blur-xl sticky top-0 z-40">
            <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
              <div class="flex items-center gap-3">
                ${data.avatar ? `
                  <div class="relative">
                    <img src="${data.avatar}" alt="${data.name || ''}" class="w-9 h-9 rounded-full object-cover ring-2 ring-orange-500/40" />
                    <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 border-2 border-zinc-950 rounded-full"></span>
                  </div>
                ` : ''}
                <div>
                  <span class="font-bold text-white text-xs sm:text-sm block leading-tight">${data.name || ''}</span>
                  <span class="text-[10px] text-zinc-400 font-mono block">${data.tagline || ''}</span>
                </div>
              </div>

              <div class="flex items-center gap-2 px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-emerald-400 text-xs font-mono">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>API Connected</span>
              </div>
            </div>
          </header>

          <!-- Main Profile Section (Dynamic) -->
          <main class="max-w-4xl mx-auto px-4 py-10 w-full flex-1">
            
            <div class="glass-card rounded-3xl p-6 sm:p-8 mb-8 text-center relative overflow-hidden">
              
              ${data.avatar ? `
                <div class="relative inline-block mb-4">
                  <img src="${data.avatar}" alt="${data.name || ''}" class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl object-cover ring-4 ring-orange-500/30 mx-auto shadow-2xl" />
                  <div class="absolute -bottom-2 -right-2 px-2.5 py-0.5 rounded-full bg-emerald-500 text-black text-[10px] font-black uppercase tracking-wider flex items-center gap-1 shadow-md">
                    <span class="w-1.5 h-1.5 rounded-full bg-black"></span>
                    <span>Online</span>
                  </div>
                </div>
              ` : ''}

              ${data.name ? `
                <div class="flex items-center justify-center gap-2 mb-1">
                  <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">${data.name}</h1>
                  <i class="fa-solid fa-circle-check text-blue-400 text-base"></i>
                </div>
              ` : ''}

              ${data.tagline ? `
                <p class="text-xs sm:text-sm font-mono text-orange-400 font-semibold mb-3">${data.tagline}</p>
              ` : ''}

              ${data.location ? `
                <div class="flex items-center justify-center gap-2 text-xs text-zinc-400 mb-5">
                  <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/5 border border-white/5 font-mono text-[11px]">
                    <i class="fa-solid fa-location-dot text-zinc-500"></i>
                    <span>${data.location}</span>
                  </span>
                </div>
              ` : ''}

              ${data.bio ? `
                <p class="text-zinc-300 text-xs sm:text-sm max-w-xl mx-auto leading-relaxed italic mb-6">
                  "${data.bio}"
                </p>
              ` : ''}

              <!-- 1-Click Action Buttons -->
              <div class="flex flex-wrap items-center justify-center gap-3">
                ${data.whatsapp ? `
                  <a href="${data.whatsapp}" target="_blank" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center gap-2 shadow-lg shadow-emerald-950/40 transition-all hover:scale-105">
                    <i class="fa-brands fa-whatsapp text-base"></i>
                    <span>WhatsApp</span>
                  </a>
                ` : ''}

                ${data.email ? `
                  <a href="mailto:${data.email}" class="px-5 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-black font-bold text-xs flex items-center gap-2 shadow-lg shadow-orange-950/40 transition-all hover:scale-105">
                    <i class="fa-solid fa-envelope text-sm"></i>
                    <span>Send Email</span>
                  </a>

                  <button onclick="copyEmail('${data.email}')" class="px-4 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 font-bold text-xs flex items-center gap-2 border border-white/10 transition-colors">
                    <i id="copy-icon" class="fa-regular fa-copy text-sm"></i>
                    <span id="copy-label">Copy Email</span>
                  </button>
                ` : ''}
              </div>

            </div>

            <!-- Dynamic Channels Heading -->
            <div class="flex items-center justify-between mb-5">
              <div>
                <h2 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                  <i class="fa-solid fa-share-nodes text-orange-500 text-sm"></i>
                  <span>Live Contact & Social Directory</span>
                </h2>
                <p class="text-[11px] text-zinc-400 font-mono">Dynamically loaded from database</p>
              </div>
              <div class="text-[11px] font-mono text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-lg">
                ${activeChannelsCount} Active Channels
              </div>
            </div>

            <!-- Channels Grid (Strictly generated from API values) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${cardsHtml}
            </div>

          </main>

          <!-- Footer (Dynamic) -->
          <footer class="w-full border-t border-white/5 py-6 bg-zinc-950 mt-12 text-center text-xs text-zinc-500 font-mono">
            &copy; ${new Date().getFullYear()} ${data.name || ''} &bull; Live API: <code class="text-orange-400">/api/public/contact</code>
          </footer>

          <!-- Floating WhatsApp button (if present in API) -->
          ${data.whatsapp ? `
            <a href="${data.whatsapp}" target="_blank" class="fixed bottom-6 right-6 z-50 flex items-center gap-2.5 px-4 py-3 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-2xl shadow-emerald-950/80 transition-all hover:scale-105">
              <i class="fa-brands fa-whatsapp text-lg"></i>
              <span class="hidden sm:inline">WhatsApp</span>
            </a>
          ` : ''}
        `;

      } catch (err) {
        console.error("Load failed:", err);
        app.innerHTML = `
          <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
            <div class="w-16 h-16 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center text-2xl mb-4 border border-red-500/20">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2 class="text-white font-bold text-lg">Failed to Fetch from API</h2>
            <p class="text-zinc-400 text-xs mt-1 font-mono">${err.message}</p>
            <button onclick="loadLiveData()" class="mt-4 px-4 py-2 rounded-xl bg-orange-500 text-black font-bold text-xs">
              Retry
            </button>
          </div>
        `;
      }
    }

    function copyEmail(email) {
      navigator.clipboard.writeText(email);
      const icon = document.getElementById('copy-icon');
      const label = document.getElementById('copy-label');
      if (icon) icon.className = 'fa-solid fa-check text-emerald-400';
      if (label) label.textContent = 'Copied!';
      setTimeout(() => {
        if (icon) icon.className = 'fa-regular fa-copy text-sm';
        if (label) label.textContent = 'Copy Email';
      }, 2000);
    }

    // Run on page load
    loadLiveData();
  </script>

</body>
</html>
