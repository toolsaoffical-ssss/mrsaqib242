<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Contact Portal | Powered by REST API</title>
  
  <!-- Tailwind CSS CDN (Zero Setup) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome 6 Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #08090d;
      color: #f3f4f6;
    }
    .glass-card {
      background: rgba(17, 20, 29, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      border-color: rgba(249, 115, 22, 0.35);
      transform: translateY(-3px);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white relative">

  <!-- Ambient Glowing Background Lights -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[700px] h-[450px] bg-orange-600/15 rounded-full blur-[140px]"></div>
    <div class="absolute bottom-10 -left-20 w-[500px] h-[400px] bg-blue-600/10 rounded-full blur-[130px]"></div>
    <div class="absolute top-1/2 -right-20 w-[450px] h-[350px] bg-emerald-600/10 rounded-full blur-[130px]"></div>
  </div>

  <!-- ROOT CONTAINER: EVERYTHING IS RENDERED HERE VIA JAVASCRIPT & API -->
  <div id="contact-app" class="w-full flex-1 flex flex-col justify-between">
    
    <!-- Initial Loading State -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
      <div class="relative mb-6">
        <div class="w-16 h-16 border-4 border-orange-500/20 border-t-orange-500 rounded-full animate-spin"></div>
        <div class="absolute inset-0 flex items-center justify-center text-orange-400">
          <i class="fa-solid fa-bolt text-sm animate-pulse"></i>
        </div>
      </div>
      <h2 class="text-white font-extrabold text-xl tracking-tight">Connecting to Central API Hub...</h2>
      <p class="text-zinc-400 text-xs mt-2 font-mono">Fetching live contact & social media channels</p>
      <div class="mt-4 px-3.5 py-1.5 rounded-full bg-zinc-900 border border-white/10 text-orange-400 text-[11px] font-mono select-all">
        GET https://mrsaqib242.vercel.app/api/public/contact
      </div>
    </div>

  </div>

  <!-- ========================================================================= -->
  <!-- JAVASCRIPT: 100% DYNAMIC API-DRIVEN ENGINE -->
  <!-- ========================================================================= -->
  <script>
    const API_URL = "https://mrsaqib242.vercel.app/api/public/contact";

    // 1. Fetch from live API
    async function initContactPortal() {
      const appContainer = document.getElementById('contact-app');

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const result = await response.json();
        if (!result.success || !result.data) throw new Error("Invalid API payload");

        const data = result.data;
        renderEntireContactSection(data, appContainer);

      } catch (error) {
        console.error("API Fetch Error:", error);
        renderErrorState(error.message, appContainer);
      }
    }

    // 2. Render Entire Contact Section Dynamically (Zero Hardcoding)
    function renderEntireContactSection(p, container) {
      const avatarUrl = p.avatar || "https://ik.imagekit.io/mrsaqib/mrsaqib242-img1_yPzIc8MWvY.png?tr=w-200,h-200,fo-auto,q-90";
      const cleanPhone = (p.phone || '').replace(/[^0-9+]/g, '');
      const portfolioUrl = p.portfolio || "https://mrsaqib242.vercel.app";
      let portfolioHostname = "mrsaqib242.vercel.app";
      try { portfolioHostname = new URL(portfolioUrl).hostname; } catch(e) {}

      // Build List of Dynamic Channels
      const channels = [];

      // WhatsApp
      if (p.whatsapp) {
        channels.push({
          title: "WhatsApp Direct",
          subtitle: "Instant Chat & Project Discussion",
          value: p.phone || "Chat on WhatsApp",
          url: p.whatsapp,
          icon: "fa-brands fa-whatsapp",
          color: "text-emerald-400",
          bgColor: "bg-emerald-500/10",
          badgeColor: "text-emerald-400/80",
          tag: "Active Now"
        });
      }

      // Email
      if (p.email) {
        channels.push({
          title: "Official Email",
          subtitle: "Client Inquiries & Proposals",
          value: p.email,
          url: `mailto:${p.email}`,
          icon: "fa-solid fa-envelope",
          color: "text-orange-400",
          bgColor: "bg-orange-500/10",
          badgeColor: "text-orange-400/80",
          tag: "Direct Inbox"
        });
      }

      // Phone
      if (p.phone) {
        channels.push({
          title: "Direct Phone Call",
          subtitle: "Voice Communication",
          value: p.phone,
          url: `tel:${cleanPhone}`,
          icon: "fa-solid fa-phone",
          color: "text-violet-400",
          bgColor: "bg-violet-500/10",
          badgeColor: "text-violet-400/80",
          tag: "Voice Line"
        });
      }

      // Instagram
      if (p.instagram) {
        channels.push({
          title: "Instagram",
          subtitle: "Design Portfolio & Updates",
          value: "@mr_saqib242",
          url: p.instagram,
          icon: "fa-brands fa-instagram",
          color: "text-pink-400",
          bgColor: "bg-gradient-to-tr from-amber-500/10 via-pink-500/10 to-purple-500/10",
          badgeColor: "text-pink-400/80",
          tag: "Social Hub"
        });
      }

      // GitHub
      if (p.github) {
        channels.push({
          title: "GitHub Repository",
          subtitle: "Open-Source Code & Architecture",
          value: "github.com/mrsaqib242",
          url: p.github,
          icon: "fa-brands fa-github",
          color: "text-zinc-200",
          bgColor: "bg-zinc-700/20",
          badgeColor: "text-zinc-400",
          tag: "Source Code"
        });
      }

      // Portfolio
      if (p.portfolio) {
        channels.push({
          title: "Master Portfolio",
          subtitle: "Interactive Digital Showcase",
          value: portfolioHostname,
          url: p.portfolio,
          icon: "fa-solid fa-globe",
          color: "text-blue-400",
          bgColor: "bg-blue-500/10",
          badgeColor: "text-blue-400/80",
          tag: "Official Web"
        });
      }

      // Facebook
      if (p.facebook && p.facebook.trim()) {
        channels.push({
          title: "Facebook",
          subtitle: "Social Network & Posts",
          value: p.name || "Muhammad Saqib",
          url: p.facebook,
          icon: "fa-brands fa-facebook",
          color: "text-blue-500",
          bgColor: "bg-blue-600/10",
          badgeColor: "text-blue-400/80",
          tag: "Community"
        });
      }

      // TikTok
      if (p.tiktok && p.tiktok.trim()) {
        channels.push({
          title: "TikTok Channel",
          subtitle: "Short-Form Tech & Video Media",
          value: "@mr_saqib_242",
          url: p.tiktok,
          icon: "fa-brands fa-tiktok",
          color: "text-rose-400",
          bgColor: "bg-rose-500/10",
          badgeColor: "text-rose-400/80",
          tag: "Video Feed"
        });
      }

      // Snapchat
      if (p.snapchat && p.snapchat.trim()) {
        channels.push({
          title: "Snapchat",
          subtitle: "Stories & Behind The Scenes",
          value: "mrsaqib242",
          url: p.snapchat,
          icon: "fa-brands fa-snapchat",
          color: "text-yellow-300",
          bgColor: "bg-yellow-400/10",
          badgeColor: "text-yellow-300/80",
          tag: "Live Stories"
        });
      }

      // Resume
      if (p.resume && p.resume.trim()) {
        channels.push({
          title: "Curriculum Vitae",
          subtitle: "Verified Technical Resume",
          value: "Download PDF",
          url: p.resume,
          icon: "fa-solid fa-file-pdf",
          color: "text-teal-400",
          bgColor: "bg-teal-500/10",
          badgeColor: "text-teal-400/80",
          tag: "Credentials"
        });
      }

      // Build Channels Grid HTML
      const channelsHtml = channels.map(item => `
        <a href="${item.url}" target="_blank" class="glass-card rounded-2xl p-4 flex items-center justify-between group">
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="w-12 h-12 rounded-2xl ${item.bgColor} ${item.color} flex items-center justify-center text-xl shrink-0">
              <i class="${item.icon}"></i>
            </div>
            <div class="min-w-0">
              <div class="text-[10px] uppercase font-bold ${item.badgeColor} tracking-wider">${item.tag}</div>
              <div class="text-sm font-bold text-white group-hover:text-orange-400 transition-colors">${item.title}</div>
              <div class="text-xs text-zinc-400 font-mono truncate">${item.value}</div>
            </div>
          </div>
          <div class="w-8 h-8 rounded-full bg-white/5 group-hover:bg-orange-500/20 text-zinc-400 group-hover:text-orange-400 flex items-center justify-center transition-colors shrink-0">
            <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
          </div>
        </a>
      `).join('');

      // Inject 100% Dynamic Content
      container.innerHTML = `
        <!-- Dynamic Header -->
        <header class="w-full border-b border-white/5 bg-zinc-950/70 backdrop-blur-xl sticky top-0 z-40">
          <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="relative">
                <img 
                  src="${avatarUrl}" 
                  alt="${p.name}" 
                  class="w-9 h-9 rounded-full object-cover ring-2 ring-orange-500/40"
                />
                <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 border-2 border-zinc-950 rounded-full"></span>
              </div>
              <div>
                <span class="font-bold text-white text-xs sm:text-sm block leading-tight">${p.name || 'Muhammad Saqib'}</span>
                <span class="text-[10px] text-zinc-400 font-mono block">REST API Live Data</span>
              </div>
            </div>

            <div class="flex items-center gap-2 px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-emerald-400 text-xs font-mono">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>API Connected</span>
            </div>
          </div>
        </header>

        <!-- Dynamic Main Section -->
        <main class="max-w-4xl mx-auto px-4 py-10 w-full flex-1">
          
          <!-- Dynamic Profile Hero Card -->
          <div class="glass-card rounded-3xl p-6 sm:p-8 mb-8 text-center relative overflow-hidden">
            
            <div class="relative inline-block mb-4">
              <img 
                src="${avatarUrl}" 
                alt="${p.name}" 
                class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl object-cover ring-4 ring-orange-500/30 mx-auto shadow-2xl"
              />
              <div class="absolute -bottom-2 -right-2 px-2.5 py-0.5 rounded-full bg-emerald-500 text-black text-[10px] font-black uppercase tracking-wider flex items-center gap-1 shadow-md">
                <span class="w-1.5 h-1.5 rounded-full bg-black"></span>
                <span>Online</span>
              </div>
            </div>

            <div class="flex items-center justify-center gap-2 mb-1">
              <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">
                ${p.name || 'Muhammad Saqib'}
              </h1>
              <i class="fa-solid fa-circle-check text-blue-400 text-base" title="Verified Creator"></i>
            </div>

            <p class="text-xs sm:text-sm font-mono text-orange-400 font-semibold mb-3">
              ${p.tagline || 'Full-Stack Engineer & Cyber Security Specialist'}
            </p>

            <div class="flex flex-wrap items-center justify-center gap-2 text-xs text-zinc-400 mb-5">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/5 border border-white/5 font-mono text-[11px]">
                <i class="fa-solid fa-location-dot text-zinc-500"></i>
                <span>${p.location || 'Gojra, Faisalabad, PK'}</span>
              </span>
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-mono text-[11px]">
                <i class="fa-solid fa-bolt text-[10px]"></i>
                <span>Available For Hire</span>
              </span>
            </div>

            <p class="text-zinc-300 text-xs sm:text-sm max-w-xl mx-auto leading-relaxed italic mb-6">
              "${p.bio || 'Available for elite web applications and scalable AI systems.'}"
            </p>

            <!-- 1-Click Action Buttons -->
            <div class="flex flex-wrap items-center justify-center gap-3">
              ${p.whatsapp ? `
                <a 
                  href="${p.whatsapp}" 
                  target="_blank" 
                  class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center gap-2 shadow-lg shadow-emerald-950/40 transition-all hover:scale-105"
                >
                  <i class="fa-brands fa-whatsapp text-base"></i>
                  <span>WhatsApp Chat</span>
                </a>
              ` : ''}

              ${p.email ? `
                <a 
                  href="mailto:${p.email}" 
                  class="px-5 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-black font-bold text-xs flex items-center gap-2 shadow-lg shadow-orange-950/40 transition-all hover:scale-105"
                >
                  <i class="fa-solid fa-envelope text-sm"></i>
                  <span>Send Email</span>
                </a>

                <button 
                  onclick="copyToClipboard('${p.email}')" 
                  class="px-4 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 font-bold text-xs flex items-center gap-2 border border-white/10 transition-colors"
                  title="Copy Email Address"
                >
                  <i id="copy-icon" class="fa-regular fa-copy text-sm"></i>
                  <span id="copy-label">Copy Email</span>
                </button>
              ` : ''}
            </div>

          </div>

          <!-- Section Heading -->
          <div class="flex items-center justify-between mb-5">
            <div>
              <h2 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-share-nodes text-orange-500 text-sm"></i>
                <span>Live Contact & Social Directory</span>
              </h2>
              <p class="text-[11px] text-zinc-400 font-mono">Loaded in real-time from master database</p>
            </div>
            <div class="text-[11px] font-mono text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-lg hidden sm:block">
              200 OK &bull; ${channels.length} Channels Active
            </div>
          </div>

          <!-- Channels Grid (All Generated Dynamically) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${channelsHtml}
          </div>

        </main>

        <!-- Dynamic Footer -->
        <footer class="w-full border-t border-white/5 py-6 bg-zinc-950 mt-12 text-center text-xs text-zinc-500 font-mono">
          &copy; ${new Date().getFullYear()} ${p.name || 'Muhammad Saqib'} &bull; API Endpoint: <code class="text-orange-400">/api/public/contact</code>
        </footer>

        <!-- Floating WhatsApp -->
        ${p.whatsapp ? `
          <a 
            href="${p.whatsapp}" 
            target="_blank" 
            class="fixed bottom-6 right-6 z-50 flex items-center gap-2.5 px-4 py-3 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-2xl shadow-emerald-950/80 transition-all hover:scale-105"
          >
            <i class="fa-brands fa-whatsapp text-lg"></i>
            <span class="hidden sm:inline">WhatsApp</span>
          </a>
        ` : ''}
      `;
    }

    // 3. Error Fallback State
    function renderErrorState(errMsg, container) {
      container.innerHTML = `
        <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
          <div class="w-16 h-16 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center text-2xl mb-4 border border-red-500/20">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
          <h2 class="text-white font-bold text-lg">Could Not Load Contact Data</h2>
          <p class="text-zinc-400 text-xs mt-1 max-w-md">${errMsg}</p>
          <button 
            onclick="initContactPortal()" 
            class="mt-5 px-4 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-black font-bold text-xs transition-colors"
          >
            Retry API Call
          </button>
        </div>
      `;
    }

    // 4. Copy Email Helper
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text);
      const icon = document.getElementById('copy-icon');
      const label = document.getElementById('copy-label');
      if (icon) icon.className = 'fa-solid fa-check text-emerald-400';
      if (label) label.textContent = 'Copied!';
      setTimeout(() => {
        if (icon) icon.className = 'fa-regular fa-copy text-sm';
        if (label) label.textContent = 'Copy Email';
      }, 2000);
    }

    // Start App
    initContactPortal();
  </script>

</body>
</html>
